<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OBS Page-Controlled Remote</title>
</head>
<body>
  <h2>Scene Controller (via OBS Browser Source)</h2>
  <button onclick="switchScene('Scene 1')">Go to Scene 1</button>
  <button onclick="switchScene('Scene 2')">Go to Scene 2</button>
  <button onclick="toggleSource('Camera')">Toggle Camera Source</button>

  <script>
    function switchScene(sceneName) {
      if (typeof obsstudio !== 'undefined') {
        obsstudio.setCurrentScene(sceneName);
        console.log('Switching to scene:', sceneName);
      } else {
        alert("This must be run inside OBS as a browser source with control permissions.");
      }
    }

    function toggleSource(sourceName) {
      if (typeof obsstudio !== 'undefined') {
        obsstudio.getSceneList().then(data => {
          const currentScene = data.currentScene;
          const source = currentScene.sources.find(s => s.name === sourceName);
          if (source) {
            obsstudio.setSourceVisibility(source.name, !source.render);
            console.log('Toggling source:', source.name);
          }
        });
      }
    }
  </script>
</body>
</html>
