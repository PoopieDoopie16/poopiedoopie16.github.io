<!DOCTYPE html>
<html>
<body>
  <h1>OBS Access Test</h1>
  <button onclick="test()">Test Access</button>

  <script>
    async function test() {
      if (!window.obsstudio || !window.obsstudio.call) {
        alert("❌ No OBS access. Check Page Permissions in Browser Source.");
        return;
      }

      try {
        const version = await window.obsstudio.call("GetVersion");
        alert("✅ Connected to OBS: " + version.obsVersion);
      } catch (err) {
        alert("❌ Failed to call OBS: " + err.message);
      }
    }
  </script>
</body>
</html>
